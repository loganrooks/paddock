name: Validate Spa Geometry

on:
  push:
    branches:
      - spa-geometry-validation
    paths:
      - "spa-race-lab/tools/**"
      - ".github/workflows/spa-geometry-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: spa-geometry-validation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical tools
        run: python -m pip install --disable-pip-version-check numpy

      - name: Build and validate independent reference model
        run: python spa-race-lab/tools/build_reference_model.py

      - name: Commit validated reference model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spa-race-lab/data/reference
          if git diff --cached --quiet; then
            echo "Reference model is unchanged."
          else
            git commit -m "data: generate validated Spa reference model [skip ci]"
            git push origin HEAD:spa-geometry-validation
          fi

      - name: Archive validated reference model
        uses: actions/upload-artifact@v4
        with:
          name: spa-reference-model
          path: spa-race-lab/data/reference
          if-no-files-found: error
