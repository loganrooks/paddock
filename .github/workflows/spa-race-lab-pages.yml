name: Deploy Spa Race Lab

on:
  push:
    branches:
      - spa-race-lab-pages
    paths:
      - "spa-race-lab/**"
      - ".github/workflows/spa-race-lab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spa-race-lab-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Spa Race Lab
        uses: actions/upload-pages-artifact@v4
        with:
          path: spa-race-lab

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
